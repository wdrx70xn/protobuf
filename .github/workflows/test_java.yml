name: Java Tests
'on':
  workflow_call:
    inputs:
      continuous-run:
        required: true
        description: Boolean string denoting whether this run is continuous -- empty
          string for presubmit, non-empty string for continuous.
        type: string
      safe-checkout:
        required: true
        description: The SHA key for the commit we want to run over
        type: string
      continuous-prefix:
        required: true
        description: The string continuous-only tests should be prefixed with when
          displaying test results.
        type: string
permissions:
  contents: read
jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: OpenJDK 8
          cache_key: '8'
          image: us-docker.pkg.dev/protobuf-build/containers/test/linux/java:9.0.0-11-1c31a2985011c75c33dcdf646fc86898aac1ec5d
          targets: //java/... //java/internal:java_version --features=-layering_check
          flags: --java_language_version=8
        - name: OpenJDK 11
          cache_key: '11'
          image: us-docker.pkg.dev/protobuf-build/containers/test/linux/java:9.0.0-11-1c31a2985011c75c33dcdf646fc86898aac1ec5d
          targets: //java/... //java/internal:java_version //compatibility/...
          continuous-only: true
        - name: OpenJDK 17
          cache_key: '17'
          image: us-docker.pkg.dev/protobuf-build/containers/test/linux/java:9.0.0-17-1c31a2985011c75c33dcdf646fc86898aac1ec5d
          targets: //java/... //java/internal:java_version //compatibility/...
        - name: OpenJDK 21 bazel 8
          cache_key: bazel8
          image: us-docker.pkg.dev/protobuf-build/containers/test/linux/java:8.6.0-21-856ad422dddd3b8fbd85e36129496b37bba174ef
          targets: //java/... //java/internal:java_version //compatibility/...
        - name: OpenJDK 21
          cache_key: '21'
          image: us-docker.pkg.dev/protobuf-build/containers/test/linux/java:9.0.0-21-1c31a2985011c75c33dcdf646fc86898aac1ec5d
          targets: //java/... //java/internal:java_version //compatibility/...
    name: ${{ matrix.continuous-only && inputs.continuous-prefix || '' }} Linux ${{
      matrix.name }}
    runs-on: ubuntu-latest
    steps:
    - name: Checkout pending changes
      uses: protocolbuffers/protobuf-ci/checkout@v5
      if: ${{ !matrix.continuous-only || inputs.continuous-run }}
      with:
        ref: ${{ inputs.safe-checkout }}
    - name: Run tests
      uses: protocolbuffers/protobuf-ci/bazel-docker@v5
      if: ${{ !matrix.continuous-only || inputs.continuous-run }}
      with:
        image: ${{ matrix.image }}
        credentials: ${{ secrets.GAR_SERVICE_ACCOUNT }}
        bazel-cache: java_linux/${{ matrix.cache_key }}
        bazel: test ${{ matrix.targets }} ${{ matrix.flags }} --test_env=KOKORO_JAVA_VERSION
  protobuf-bom:
    name: Protobuf Maven BOM
    runs-on: ubuntu-latest
    steps:
    - name: Checkout pending changes
      uses: protocolbuffers/protobuf-ci/checkout@v5
      with:
        ref: ${{ inputs.safe-checkout }}
    - name: Generate maven artifacts with bazel and install using maven
      uses: protocolbuffers/protobuf-ci/bazel-docker@v5
      with:
        image: us-docker.pkg.dev/protobuf-build/containers/test/linux/java:9.0.0-11-1c31a2985011c75c33dcdf646fc86898aac1ec5d
        credentials: ${{ secrets.GAR_SERVICE_ACCOUNT }}
        bazel-cache: java_linux/11
        bash: 'set -ex

          bazel build //java:release $BAZEL_FLAGS

          mvn install:install-file -Dfile=java/bom/pom.xml -DpomFile=java/bom/pom.xml

          mvn install:install-file -Dfile=java/pom.xml -DpomFile=java/pom.xml

          mvn install:install-file -Dfile=bazel-bin/java/core/core_mvn-project.jar
          -DpomFile=bazel-bin/java/core/core_mvn-pom.xml

          mvn install:install-file -Dfile=bazel-bin/java/core/lite_mvn-project.jar
          -DpomFile=bazel-bin/java/core/lite_mvn-pom.xml

          mvn install:install-file -Dfile=bazel-bin/java/kotlin-lite/kotlin-lite_mvn-project.jar
          -DpomFile=bazel-bin/java/kotlin-lite/kotlin-lite_mvn-pom.xml

          mvn install:install-file -Dfile=bazel-bin/java/kotlin/kotlin_mvn-project.jar
          -DpomFile=bazel-bin/java/kotlin/kotlin_mvn-pom.xml

          mvn install:install-file -Dfile=bazel-bin/java/util/util_mvn-project.jar
          -DpomFile=bazel-bin/java/util/util_mvn-pom.xml

          '
    - name: Clean up
      run: 'sudo rm -rf _build

        '
